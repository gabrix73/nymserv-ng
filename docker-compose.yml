services:
  nymserv:
    build: .
    container_name: nymserv-ng
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/nymserv/data
      - ./keys:/var/lib/nymserv/keys
      - ./config/nymserv.toml:/etc/nymserv/nymserv.toml:ro
      - ./config/msmtprc:/etc/msmtprc:ro
    environment:
      - RUST_LOG=info
      - NYMSERV_HOSTNAME=nymserv-ng.virebent.art
    networks:
      - mailnet

networks:
  mailnet:
    driver: bridge
