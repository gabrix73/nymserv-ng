# Nginx configuration for nymserv-ng.virebent.art on rasmus
server {
    listen 80;
    listen [::]:80;
    server_name nymserv-ng.virebent.art;

    access_log off;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nymserv-ng.virebent.art;
    include /etc/nginx/favicons-virebent.conf;

    ssl_certificate     /etc/letsencrypt/live/nymserv-ng.virebent.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nymserv-ng.virebent.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    server_tokens off;

    # Security headers for pure-text / hardened site
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/nymserv-ng.virebent.art;
    index index.html index.gmi;

    # Pure text MIME types
    types {
        text/gemini gmi;
        text/plain txt asc;
        text/html html;
    }

    # Browser language auto-negotiation on root URL
    # Italian browsers -> /it/
    # French browsers  -> /fr/
    # Default (all others & manual clicks to /index.html) -> English
    location = / {
        if ($http_accept_language ~* "^it") {
            return 302 /it/;
        }
        if ($http_accept_language ~* "^fr") {
            return 302 /fr/;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
