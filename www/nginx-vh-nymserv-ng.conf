# Nginx configuration for nymserv-ng.virebent.art on rasmus
server {
    listen 80;
    listen [::]:80;
    server_name nymserv-ng.virebent.art;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nymserv-ng.virebent.art;

    ssl_certificate /etc/letsencrypt/live/nymserv-ng.virebent.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nymserv-ng.virebent.art/privkey.pem;

    root /var/www/nymserv-ng.virebent.art;
    index index.html index.gmi;

    # Pure text MIME types
    types {
        text/gemini gmi;
        text/plain txt asc;
        text/html html;
    }

    # Security headers for pure-text site
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; font-src 'self' data:; img-src 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
