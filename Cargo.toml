[package]
name = "nymserv-ng"
version = "0.2.0"
edition = "2021"
authors = ["Gab Virebent <gabriel1@virebent.art>"]
description = "High-assurance dual-stack nymserver for YAMN, backward-compatible with ghionym and post-quantum enabled"
license = "AGPL-3.0-only"

[dependencies]
# Memory hygiene & secrets
secrecy = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
memsec = "0.7"

# Cryptography - Classical
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
sha2 = "0.10"
rand = "0.8"

# Cryptography - OpenPGP (for Ghionym compatibility)
# Using pure-Rust crypto backend with explicit opt-in
sequoia-openpgp = { version = "1.22", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto", "compression"] }

# Cryptography - Post-Quantum
ml-kem = "0.2"

# Storage & Engine
redb = "2.4"

# Parsing & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.11"

# CLI & Ergonomics
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System & Time
time = { version = "0.3", features = ["formatting", "parsing"] }
